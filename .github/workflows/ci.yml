name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Validate every bundled example corpus
        run: |
          find examples -name manifest.json | while read -r m; do
            echo "== $m =="
            rubric validate "$m"
          done

  # The JavaScript port must stay byte-for-byte in step with the Python parser,
  # and the inlined example bundle must be current. Both are checked here with no
  # npm dependencies to install.
  web-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Example bundle is up to date
        run: |
          node web/build_examples.cjs
          git diff --exit-code -- web/examples.bundle.js \
            || (echo "web/examples.bundle.js is stale — run: node web/build_examples.cjs" && exit 1)
      - name: JS parser and coverage parity with the Python reference
        working-directory: web
        run: npm test
