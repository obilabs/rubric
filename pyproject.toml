[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rubric-dsl"
version = "0.1.0"
description = "An open, git-native format for exam-prep question banks — with per-choice rationale and syllabus-weighted blueprints."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ObiLabs" }]
keywords = ["quiz", "exam", "question-bank", "dsl", "markdown", "assessment", "edtech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Education :: Testing",
    "Topic :: Text Processing :: Markup",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/obilabs/rubric"
Source = "https://github.com/obilabs/rubric"
Issues = "https://github.com/obilabs/rubric/issues"

[project.scripts]
rubric = "rubric.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rubric"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
